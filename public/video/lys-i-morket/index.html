<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To biler møtes i mørket | teori-test.no</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#14363f;color:#e3eeec;font:15px/1.4 Arial,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:8px;background:#0e2a31}
.start{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:#e6c65e;color:#14363f;font:700 26px Arial;cursor:pointer;box-shadow:0 6px 24px #0006}
.start[hidden]{display:none}
.controls{width:100%;max-width:1160px;display:flex;align-items:center;gap:8px}
button,select{min-height:40px;padding:6px 12px;border:1px solid #2f5761;border-radius:8px;background:#1b4550;color:#e3eeec;font:600 14px Arial;cursor:pointer}
button:disabled{opacity:.45}
input[type=range]{flex:1;min-width:60px;accent-color:#e6c65e}
output{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#a9c2c4}
:focus-visible{outline:3px solid #e6c65e;outline-offset:2px}
@media(max-width:520px){#view{max-width:104px}}
</style></head><body>
<div class="wrap">
 <div class="stage"><canvas id="film" width="1920" height="1080" aria-label="Animasjon: fjernlys, nærlys og blending når to biler møtes i mørket"></canvas>
  <button class="start" id="bigstart" aria-label="Spill av animasjonen" hidden>▶</button></div>
 <div class="controls">
  <button id="toggle" disabled aria-label="Spill av">Spill</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Tidspunkt" disabled>
  <output id="time">0:00 / 0:30</output>
  <select id="view" aria-label="Kamera"><option value="chase">Bak bilen</option><option value="top">Ovenfra</option></select>
 </div>
</div>
<script src="bundle.js"></script>
<script>
// Embedded player without sound: a simple clock drives renderFrame(t), so pause and seeking are exact.
// Format follows the frame: narrow portrait frames get the 4:5 mobile layout.
const el=id=>document.getElementById(id),END=30;let playing=false,t0=0,pos=0,raf=0,fmt=null;
const now=()=>playing?Math.min(END,pos+(performance.now()-t0)/1000):pos;
const mmss=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function draw(t){renderFrame(t);el('seek').value=t;el('time').textContent=mmss(t)+' / '+mmss(END);}
function state(){el('toggle').textContent=playing?'Pause':'Spill';el('toggle').setAttribute('aria-label',playing?'Pause':'Spill av');el('bigstart').hidden=playing||pos>0.1;}
function tick(){const t=now();draw(t);if(t>=END){playing=false;pos=END;state();return;}if(playing)raf=requestAnimationFrame(tick);}
function play(){if(pos>=END-0.05)pos=0;t0=performance.now();playing=true;state();tick();}
function pause(){pos=now();playing=false;cancelAnimationFrame(raf);draw(pos);state();}
el('toggle').onclick=()=>playing?pause():play();
el('bigstart').onclick=play;
el('seek').oninput=()=>{pos=Number(el('seek').value);if(playing)t0=performance.now();draw(pos);state();};
el('view').onchange=()=>{setView(el('view').value);draw(now());};
function format(){if(!window.animationReady)return;const w=innerWidth<600&&innerHeight>innerWidth?'mobile':'wide';if(w!==fmt){setFilmFormat(w);fmt=w;draw(now());}}
addEventListener('resize',format);
(function ready(){if(window.animationReady){format();draw(0);['toggle','seek'].forEach(i=>el(i).disabled=false);el('bigstart').hidden=false;}else if(!window.animationError)requestAnimationFrame(ready);})();
</script>
</body></html>
