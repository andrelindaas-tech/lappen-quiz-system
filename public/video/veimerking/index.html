<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veimerking – forstå linjene | teori-test.no</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#f8fafc;color:#0f172a;font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:16px;border:1px solid #e2e8f0;background:#fff}
.poster{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer;border-radius:16px}
.poster::after{content:"";position:absolute;left:50%;top:42%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:#0d9488 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M9 6l9 6-9 6z%27 fill=%27white%27/%3E%3C/svg%3E") center/44px no-repeat;box-shadow:0 6px 24px #0004}
.poster[hidden]{display:none}
.controls{width:100%;max-width:1160px;display:flex;align-items:center;gap:8px}
button,select{min-height:44px;min-width:44px;padding:6px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#0f172a;font:600 15px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
#toggle{background:#0d9488;border-color:#0d9488;color:#fff;min-width:84px}
button:disabled,select:disabled{opacity:.45}
input[type=range]{flex:1;min-width:60px;height:44px;accent-color:#0d9488}
output{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#64748b}
:focus-visible{outline:3px solid #14b8a6;outline-offset:2px}
@media(max-width:520px){.controls{flex-wrap:wrap}input[type=range]{order:3;flex-basis:100%}#chapter{order:4;flex-basis:100%;min-width:0}}
</style></head><body>
<div class="wrap">
 <div class="stage"><canvas id="film" width="1080" height="1350" aria-label="Animasjon om veimerking med fortellerstemme"></canvas>
  <button class="poster" id="bigstart" aria-label="Spill av filmen" hidden></button></div>
 <div class="controls">
  <button id="toggle" disabled aria-label="Spill av">Spill</button>
  <output id="time">0:00</output>
  <input id="seek" type="range" min="0" max="170" step="0.01" value="0" aria-label="Tidspunkt" disabled>
  <select id="chapter" aria-label="Velg kapittel" disabled></select>
 </div>
</div>
<audio id="voice" src="fortelling.mp3" preload="metadata"></audio>
<script src="bundle.js"></script>
<script src="player.js"></script>
</body></html>
