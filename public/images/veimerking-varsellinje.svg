<text x="190" y="278" fill="#eaeae6" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="middle">Gul — sikten er for kort til forbikjøring</text>
<text x="610" y="278" fill="#eaeae6" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="middle">Hvit — fare ved å skifte kjørefelt</text>
