<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="ttl dsc"><title id="ttl">Gul og hvit varsellinje sett ovenfra</title><desc id="dsc">Varsellinje har lang strek og kort opphold, motsatt av kjorefeltlinje. Gul varsellinje mellom motgaende retninger betyr at sikten fremover er for kort til vanlig forbikjoring. Hvit varsellinje varsler fare ved feltskifte.</desc><rect width="800" height="300" rx="12" fill="#262624"/>
<text x="400" y="30" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" text-anchor="middle">Varsellinje har lang strek og kort opphold — den kan krysses med forsiktighet</text>
