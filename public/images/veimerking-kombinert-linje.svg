<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="ttl dsc"><title id="ttl">Kombinert linje sett ovenfra, med bilens plassering markert</title><desc id="dsc">Kombinert linje er en varsellinje og en sperrelinje ved siden av hverandre. I det venstre bildet ligger varsellinjen naermest bilen, og forbikjoring er tillatt. I det hoyre ligger sperrelinjen naermest, og forbikjoring er forbudt. Har du kjort over i motgaende felt, kan du likevel kjore tilbake til hoyre vegside.</desc><rect width="800" height="300" rx="12" fill="#262624"/>
<text x="400" y="32" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" text-anchor="middle">Kombinert linje: det er linjen nærmest deg som gjelder</text>
