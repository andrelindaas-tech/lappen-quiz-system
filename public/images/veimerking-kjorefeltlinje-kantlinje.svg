<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" width="480" height="322" role="img" aria-labelledby="ttl dsc"><title id="ttl">Kjorefeltlinje og kantlinje pa samme vei, sett ovenfra</title><desc id="dsc">En vei sett ovenfra med heltrukne hvite kantlinjer langs begge ytterkanter og en stiplet hvit kjorefeltlinje i midten. Kantlinje 1012 er alltid heltrukken og markerer kjorebanens ytterkant. Kjorefeltlinje 1000 har kort strek og langt opphold og skiller kjorefelt i samme retning. En stiplet linje er derfor ikke en kantlinje.</desc><rect width="480" height="322" rx="12" fill="#262624"/>
<rect x="60" y="20" width="360" height="170" rx="6" fill="#3f3f3c"/>
<rect x="76" y="30" width="7" height="150" fill="#f6f6f3"/>
<rect x="397" y="30" width="7" height="150" fill="#f6f6f3"/>
<line x1="240" y1="30" x2="240" y2="180" stroke="#f6f6f3" stroke-width="5" stroke-dasharray="11 30"/>
<path d="M156 98 l8 16 h-16 z" fill="#eaeae6" opacity=".85"/>
<path d="M324 98 l8 16 h-16 z" fill="#eaeae6" opacity=".85"/>
<line x1="60" y1="228" x2="110" y2="228" stroke="#f6f6f3" stroke-width="5" stroke-dasharray="11 14"/>
<text x="126" y="235" fill="#eaeae6" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="600" text-anchor="start">Kjørefeltlinje (1000)</text>
<text x="126" y="258" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="start">stiplet – skiller kjørefelt</text>
<line x1="60" y1="278" x2="110" y2="278" stroke="#f6f6f3" stroke-width="5"/>
<text x="126" y="285" fill="#eaeae6" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="600" text-anchor="start">Kantlinje (1012)</text>
<text x="126" y="308" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="start">heltrukken – viser ytterkanten</text>
</svg>
