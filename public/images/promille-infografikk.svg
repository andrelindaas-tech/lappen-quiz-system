<text x="658.0" y="394" fill="#f2f2ef" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Du kan ha promille dagen</text>
<text x="658.0" y="415" fill="#f2f2ef" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="400" text-anchor="middle">derpå. Er du i tvil,</text>
<text x="658.0" y="436" fill="#f2f2ef" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="400" text-anchor="middle">la bilen stå.</text>
