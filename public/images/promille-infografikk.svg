<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 556" width="800" height="556" role="img" aria-labelledby="ttl dsc"><title id="ttl">Promillegrense for bilkjøring i Norge</title><desc id="dsc">Promillegrensen i Norge er 0,2 promille. Kjorer du med mer enn 0,2 promille i blodet, regnes du som paavirket etter vegtrafikkloven § 22. Alkohol svekker reaksjon, oppmerksomhet og vurderingsevne. Du kan ha promille dagen derpaa — er du i tvil, la bilen staa.</desc><rect width="800" height="556" rx="12" fill="#262624"/>
<text x="400" y="50" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="25" font-weight="600" text-anchor="middle">Promillegrense for bilkjøring i Norge</text>
