<text x="20" y="214" fill="#eaeae6" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="600" text-anchor="start">Hvit sperrelinje</text>
<text x="20" y="238" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500" text-anchor="start">skiller kjørefelt i samme retning</text>
