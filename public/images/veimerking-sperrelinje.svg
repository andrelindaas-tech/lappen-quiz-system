<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" width="480" height="506" role="img" aria-labelledby="ttl dsc"><title id="ttl">Hvit og gul sperrelinje sett ovenfra</title><desc id="dsc">Hvit sperrelinje skiller kjorefelt i samme kjoreretning; begge retningspilene peker samme vei. Gul sperrelinje skiller motgaende kjoreretninger; pilene peker mot hverandre. Begge er heltrukne og skal ikke krysses.</desc><rect width="480" height="506" rx="12" fill="#262624"/>
