<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="ttl dsc"><title id="ttl">Hvit og gul sperrelinje sett ovenfra</title><desc id="dsc">Hvit sperrelinje skiller kjorefelt i samme kjoreretning; begge retningspilene peker samme vei. Gul sperrelinje skiller motgaende kjoreretninger; pilene peker mot hverandre. Begge er heltrukne og skal ikke krysses.</desc><rect width="800" height="300" rx="12" fill="#262624"/>
<text x="400" y="30" fill="#a3a39d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" text-anchor="middle">Sperrelinje er heltrukken — den skal ikke krysses</text>
