<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To biler møtes i mørket | teori-test.no</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f2329;color:#e3eeec;font:15px/1.4 Arial,sans-serif}main{max-width:1200px;margin:20px auto;padding:0 16px}
h1{font-size:22px;margin:0 0 12px}body.mobile canvas{max-width:440px;margin:0 auto}canvas{display:block;width:100%;height:auto;border-radius:10px;background:#14363f}
.controls{display:flex;gap:8px;align-items:center;padding:12px 0}button{min-height:42px;padding:8px 14px;border:1px solid #2f5761;border-radius:8px;background:#1b4550;color:#e3eeec;font:600 14px Arial;cursor:pointer}
button:disabled{opacity:.45}select{min-height:42px;padding:8px;border:1px solid #2f5761;border-radius:8px;background:#1b4550;color:#e3eeec;font:600 14px Arial}input[type=range]{flex:1;accent-color:#e6c65e}output{font-variant-numeric:tabular-nums;color:#a9c2c4}#status{color:#a9c2c4;font-size:13px}
</style></head><body><main>
<h1>To biler møtes i mørket – hva skjer med lyset og sikten?</h1>
<canvas id="film" width="1920" height="1080" aria-label="Animasjon: fjernlys, nærlys og møtende bil i mørket"></canvas>
<div class="controls"><button id="start" disabled>Start</button><button id="pause" disabled>Pause</button><button id="replay" disabled>Omspill</button><select id="format" aria-label="Format"><option value="auto">Tilpass skjermen</option><option value="wide">Bredformat 16:9</option><option value="mobile">Mobil 4:5</option></select><select id="view" aria-label="Kamera"><option value="chase">Bak bilen</option><option value="top">Ovenfra</option></select><input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Tidspunkt" disabled><output id="time">0:00 / 0:30</output></div>
<p id="status">Laster …</p>
</main><script src="bundle.js"></script><script src="player.js"></script></body></html>
